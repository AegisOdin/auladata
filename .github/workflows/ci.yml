name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Validate, test and analyze backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auladata_test
          POSTGRES_DB: auladata_test
          # Ephemeral isolated CI service; not a deployed credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auladata_test -d auladata_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: TEST
      DATABASE_URL: postgresql+psycopg://auladata_test@127.0.0.1:5432/auladata_test
      TEST_DATABASE_URL: postgresql+psycopg://auladata_test@127.0.0.1:5432/auladata_test
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/backend/requirements.lock
      - name: Generate temporary signing key
        run: |
          key=$(python -c 'import secrets; print(secrets.token_hex(32))')
          echo "::add-mask::$key"
          printf 'JWT_SECRET=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install -r app/backend/requirements.lock
          python -m pip install -c app/backend/requirements-dev.lock -e './app/backend[dev]'
      - name: Ruff lint and formatting
        run: |
          ruff check app/backend tests/backend migrations deploy/scripts
          ruff format --check app/backend tests/backend migrations deploy/scripts
      - name: Validate configuration and migrate isolated test database
        run: |
          python -m app.config
          alembic upgrade head
          alembic check
      - name: Backend integration suite
        run: pytest tests/backend -v --junitxml=backend-results.xml
      - name: Deployment script contracts
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          python -m unittest discover -s deploy/tests -v
      - name: Dependency audit
        run: pip-audit -r app/backend/requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend-results.xml

  frontend:
    name: Validate, build and analyze frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  repository:
    name: Compose and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked secret files and obvious private key material
        shell: bash
        run: |
          python deploy/scripts/check-secrets.py
      - name: Validate GitHub Actions syntax
        run: >-
          docker run --rm --volume "$PWD/.github:/work:ro"
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file /work/actionlint.yaml /work/workflows/ci.yml /work/workflows/promote.yml
      - name: Validate Compose without printing interpolated secrets
        env:
          POSTGRES_PASSWORD: disposable-compose-validation
          JWT_SECRET: disposable-compose-validation-only-32-chars
          DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/auladata_test
          APP_ENV: DEV
          APP_VERSION: ci
          GIT_COMMIT: ${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE: ghcr.io/example/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TEST_DB_PASSWORD: disposable-test-compose-validation
        run: |
          docker compose -f deploy/compose.local.yml config --quiet
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.test.yml config --quiet

  build:
    name: Build immutable release images once
    needs: [backend, frontend, repository]
    # Main/tags validate only: QA and PROD promote the already approved digests.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'backend=ghcr.io/%s-backend\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'frontend=ghcr.io/%s-frontend\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/backend/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: app/frontend/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Record digests and Git SHA
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\nGIT_COMMIT=%s\nAPP_VERSION=sha-%s\n' \
            "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$GIT_COMMIT" "${GIT_COMMIT:0:12}" > release.env
          python deploy/scripts/release.py release.env
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.env
          retention-days: 90
