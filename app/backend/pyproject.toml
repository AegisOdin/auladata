[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "auladata-api"
version = "1.0.0"
description = "API de gestión de aulas para el laboratorio AulaData"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
