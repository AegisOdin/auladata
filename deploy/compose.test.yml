name: auladata-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auladata_test
      POSTGRES_USER: auladata_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set a temporary TEST_DB_PASSWORD}
    ports: ['127.0.0.1:${TEST_DB_PORT:-5433}:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, auladata_test, -d, auladata_test]
      interval: 3s
      timeout: 5s
      retries: 15
